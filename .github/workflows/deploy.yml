name: Deploy Flutter SimplyMind Web

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SimplyMind
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Custom domain simplymind.nzilo.com is served at the site root,
      # so base-href must be "/". Do NOT use "/simplymind/" here.
      - name: Build Web App
        run: flutter build web --release --base-href "/"

      # Peaceiris force-orphans gh-pages each run. Without a CNAME file in
      # the published folder, GitHub clears the custom domain. web/CNAME is
      # copied by Flutter; this step guarantees it even if that ever changes.
      - name: Ensure custom domain CNAME
        run: echo "simplymind.nzilo.com" > build/web/CNAME

      - name: Deploy to gh-pages branch
        uses: Peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: simplymind.nzilo.com

